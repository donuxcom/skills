name: Bug report
description: Report a reproducible, sanitized defect.
title: "[Bug]: "
body:
  - type: input
    id: skill
    attributes: {label: Skill and version}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Client and operating system}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction, description: Use synthetic data and sanitized logs only.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
