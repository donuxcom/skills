name: Evaluation census
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - run: python3 -m unittest tests.test_activation tests.test_contract -v
      - run: python3 scripts/repo_tool.py catalog --check