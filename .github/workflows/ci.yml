name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - run: python3 scripts/repo_tool.py validate
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/repo_tool.py catalog --check
      - run: python3 scripts/repo_tool.py security
      - run: python3 scripts/repo_tool.py build
      - run: python3 scripts/repo_tool.py verify
