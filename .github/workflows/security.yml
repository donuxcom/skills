name: Security census
on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - run: python3 -m py_compile scripts/repo_tool.py tests/*.py
      - run: python3 scripts/repo_tool.py security
      - run: python3 -m unittest tests.test_security -v
      - run: python3 scripts/repo_tool.py build
      - run: python3 scripts/repo_tool.py verify