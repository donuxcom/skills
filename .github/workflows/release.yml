name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Verify tag and repository
        run: |
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("scripts/repo_tool.py")["VERSION"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 scripts/repo_tool.py validate
          python3 -m unittest discover -s tests -v
          python3 scripts/repo_tool.py catalog --check
          python3 scripts/repo_tool.py security
      - name: Official Agent Skills validation
        run: |
          python3 -m pip install 'git+https://github.com/agentskills/agentskills@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref'
          for skill in skills/*; do skills-ref validate "$skill"; done
      - name: Build and verify immutable artifacts
        run: |
          python3 scripts/repo_tool.py build
          python3 scripts/repo_tool.py verify
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"